        /**
         * Pads a number with a leading zero if it's less than 10.
         * @param {number} num - The number to pad.
         * @returns {string} The padded number as a string.
         */
        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        /**
         * Formats a Date object into HH:MM:SS GMT string.
         * @param {Date} date - The Date object to format.
         * @returns {string} Formatted time string.
         */
        function formatGMTTime(date) {
            if (!date) return '--:--:--';
            const gengs = date.getUTCHours();
            const minutes = date.getUTCMinutes();
            const seconds = date.getUTCSeconds();
            return `${pad(gengs)}:${pad(minutes)}:${pad(seconds)}`;
        }

        /**
         * Converts a Date object (assumed to be GMT) into NuTime (Geng:Minute:Second) format.
         * @param {Date} date - The Date object to convert.
         * @returns {string} Formatted NuTime string.
         */
        function convertGMTToNuTime(date) {
            if (!date) return '--:--:--';

            const standardGengs = date.getUTCHours();
            const standardMinutes = date.getUTCMinutes();
            const standardSeconds = date.getUTCSeconds();

            const totalStandardSeconds = (standardGengs * 3600) + (standardMinutes * 60) + standardSeconds;
            const fractionOfDay = totalStandardSeconds / 86400; // Total seconds in a standard day

            const totalNuTimeSeconds = fractionOfDay * 100000; // Scale to 100,000 NuTime-Seconds in a day

            const nuGengs = totalNuTimeSeconds / 10000; // 1 NuGeng = 10,000 NuTime seconds
            const remainingSecondsAfterNuGengs = totalNuTimeSeconds % 10000;

            const nuMinutes = remainingSecondsAfterNuGengs / 100; // 1 NuMinute = 100 NuTime seconds
            const nuSeconds = remainingSecondsAfterNuGengs % 100; // Remaining seconds after NuMinutes

            return `${pad(Math.floor(nuGengs))}:${pad(Math.floor(nuMinutes))}:${pad(Math.floor(nuSeconds))}`; // Floor only for digital display
        }

        /**
         * Converts a NuTime string (GG:MM:SS) into total NuTime seconds from midnight.
         * @param {string} nuTimeString - The NuTime string in "GG:MM:SS" format.
         * @returns {number} Total NuTime seconds from midnight.
         */
        function nuTimeStringToSeconds(nuTimeString) {
            if (!nuTimeString || nuTimeString === '--:--:--') return 0; // Handle initial state or invalid input
            const parts = nuTimeString.split(':').map(Number);
            const kes = parts[0]; // Assuming for this function kes might be passed as gengs if format is H:M:S
            const minutes = parts[1];
            const seconds = parts[2];
            // Reconstruct total NuTime seconds based on 10000 seconds per geng, 100 seconds per minute
            return (kes * 10000) + (minutes * 100) + seconds; // Note: kes here are effectively NuGengs
        }

        /**
         * Normalizes an angle to be within the range [0, 2*Math.PI).
         * @param {number} angle - The angle in radians.
         * @returns {number} The normalized angle.
         */
        function normalizeAngle(angle) {
            let normalized = angle % (2 * Math.PI);
            if (normalized < 0) {
                normalized += 2 * Math.PI;
            }
            return normalized;
        }

        /**
         * Blends two RGB colors.
         * @param {number[]} c1
         * @param {number[]} c2
         * @param {number} t
         * @returns {number[]}
         */
        function mixColors(c1, c2, t) {
            return [
                Math.round(c1[0] + (c2[0] - c1[0]) * t),
                Math.round(c1[1] + (c2[1] - c1[1]) * t),
                Math.round(c1[2] + (c2[2] - c1[2]) * t)
            ];
        }

        /**
         * Smoothstep helper for smoother sky transitions.
         * @param {number} edge0
         * @param {number} edge1
         * @param {number} x
         * @returns {number}
         */
        function smoothstep(edge0, edge1, x) {
            const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
            return t * t * (3 - 2 * t);
        }

        /**
         * Returns an RGB sky color based on current date/time, location, and solar altitude.
         * @param {Date} now
         * @param {number} latitude
         * @param {number} longitude
         * @returns {number[]} [r,g,b]
         */
        function getSkyColor(now, latitude, longitude) {
            const pos = SunCalc.getPosition(now, latitude, longitude);
            const altitudeDeg = pos.altitude * 180 / Math.PI;

            const ASTRO_NIGHT = [1, 1, 5];
            const NIGHT = [4, 8, 20];
            const PREDAWN = [12, 22, 52];
            const NAUTICAL_BLUE = [28, 52, 115];
            const CIVIL_BLUE = [60, 120, 215];
            const NOON_BLUE = [86, 170, 255];
            const TWILIGHT_WARM = [255, 150, 70];
            const MILKY_HINT = [30, 38, 64];

            const dayW = smoothstep(-2, 8, altitudeDeg);
            const civilW = smoothstep(-8, 2, altitudeDeg) * (1 - smoothstep(8, 20, altitudeDeg));
            const nauticalW = smoothstep(-14, -4, altitudeDeg) * (1 - smoothstep(-2, 6, altitudeDeg));
            const astroW = smoothstep(-22, -10, altitudeDeg) * (1 - smoothstep(-8, 0, altitudeDeg));
            const nightW = 1 - smoothstep(-20, -12, altitudeDeg);

            const dayT = Math.pow(Math.max(0, Math.min(1, altitudeDeg / 90)), 0.58);
            const dayCol = mixColors(mixColors(CIVIL_BLUE, NOON_BLUE, 0.22), NOON_BLUE, dayT);
            const civilCol = CIVIL_BLUE;
            const nauticalCol = mixColors(PREDAWN, NAUTICAL_BLUE, 0.75);
            const astroCol = mixColors(NIGHT, PREDAWN, 0.35);

            const localHour = (now.getUTCHours() + now.getUTCMinutes() / 60 + longitude / 15 + 24) % 24;
            const distMid = Math.min(localHour, 24 - localHour) / 24;
            const deep = 1 - smoothstep(0.10, 0.25, distMid);
            const nightCol = mixColors(NIGHT, ASTRO_NIGHT, deep);

            let weights = [dayW, civilW, nauticalW, astroW, nightW];
            let total = weights.reduce((a, b) => a + b, 0);
            if (total <= 1e-9) {
                weights = [0, 0, 0, 0, 1];
                total = 1;
            }
            weights = weights.map(w => w / total);

            const palette = [dayCol, civilCol, nauticalCol, astroCol, nightCol];
            let sky = [0, 0, 0];
            for (let i = 0; i < 5; i++) {
                sky[0] += weights[i] * palette[i][0];
                sky[1] += weights[i] * palette[i][1];
                sky[2] += weights[i] * palette[i][2];
            }
            sky = sky.map(v => Math.round(v));

            const times = SunCalc.getTimes(now, latitude, longitude);
            const sunriseMs = times.sunrise ? Math.abs(now - times.sunrise) : Infinity;
            const sunsetMs = times.sunset ? Math.abs(now - times.sunset) : Infinity;
            const halfHourMs = 30 * 60 * 1000;
            const dawnWarm = Math.exp(-Math.pow(sunriseMs / halfHourMs, 2));
            const duskWarm = Math.exp(-Math.pow(sunsetMs / halfHourMs, 2));
            const warmGate = smoothstep(-8, 3, altitudeDeg) * (1 - smoothstep(6, 18, altitudeDeg));
            const warmAmount = 0.10 * (dawnWarm + duskWarm) * warmGate;
            sky = mixColors(sky, TWILIGHT_WARM, Math.max(0, Math.min(1, warmAmount)));

            const milkyGate = nightW * (1 - smoothstep(0.11, 0.24, distMid));
            const milkyWave = 0.5 + 0.5 * Math.sin((localHour / 24) * 2 * Math.PI * 3 + 1.2);
            const milky = 0.05 * milkyGate * milkyWave;
            sky = mixColors(sky, MILKY_HINT, Math.max(0, Math.min(1, milky)));

            return sky;
        }

        /**
         * Updates the page background color to match the current sky color at the selected location.
         */
        function updateBackgroundSkyColor() {
            const now = new Date();
            const sky = getSkyColor(now, userLatitude, userLongitude);
            document.body.style.backgroundColor = `rgb(${sky[0]}, ${sky[1]}, ${sky[2]})`;
        }

        /**
         * Draws the clock face, including the outer circle and center dot.
         * @param {number} longitudeOffset - The longitude offset in radians for position adjustment.
         */
        function drawFace(longitudeOffset) {
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#1A1A1A'; // Changed to Deep Black/Dark Grey #1A1A1A
            ctx.fill();

            // Draw outer border
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Draw outermost concentric circle (radius * 0.60)
            ctx.beginPath();
            const outermostConcentricRadius = radius * 0.60;
            ctx.arc(0, 0, outermostConcentricRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#35545C'; // Stroke color
            ctx.lineWidth = 3; // Stroke width
            ctx.fillStyle = '#FFB347'; // Fill color Lighter Orange #FFB347
            ctx.fill();
            ctx.stroke();

            // Draw tick markers for 0, 25, 50, 75 kes on the outermost concentric circle
            const tickKes = [0, 25, 50, 75];
            const tickLength = radius * 0.03; // Length of the tick marks
            const tickWidth = 2; // Width of the tick marks
            const tickColor = '#F5DEB3'; // Color of the tick marks
            const totalKesInCircle = 100; // Total kes for a full circle

            tickKes.forEach(keValue => {
                // Calculate angle for each tick (100 kes in a full circle, starting from 6 o'clock)
                // Apply the same longitude offset to the tick markers
                const angle = Math.PI + (keValue / totalKesInCircle) * 2 * Math.PI + longitudeOffset;

                ctx.save(); // Save the current canvas state
                ctx.rotate(angle); // Rotate to the tick's position

                ctx.beginPath();
                ctx.strokeStyle = tickColor;
                ctx.lineWidth = tickWidth;
                ctx.moveTo(0, -outermostConcentricRadius); // Start at the outermost concentric circle
                ctx.lineTo(0, -outermostConcentricRadius + tickLength); // Draw inwards
                ctx.stroke();

                ctx.restore(); // Restore the canvas state
            });


            // Draw second concentric circle (radius * 0.40)
            ctx.beginPath();
            const secondConcentricRadius = radius * 0.40;
            ctx.arc(0, 0, secondConcentricRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#F5DEB3'; // Stroke color changed to #F5DEB3
            ctx.lineWidth = 3; // Stroke width
            ctx.fillStyle = '#1A1A1A'; // Fill with Deep Black/Dark Grey #1A1A1A
            ctx.fill();
            ctx.stroke();

            // Draw third concentric circle (radius * 0.20)
            ctx.beginPath();
            const thirdConcentricRadius = radius * 0.20;
            ctx.arc(0, 0, thirdConcentricRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#FFB347'; // Stroke color Lighter Orange #FFB347
            ctx.lineWidth = 3; // Stroke width
            ctx.fillStyle = '#FF8C00'; // Fill color Vibrant Orange #FF8C00
            ctx.fill();
            ctx.stroke();

            // Draw center dot
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
            ctx.fillStyle = '#F5DEB3'; // Light Beige/Cream
            ctx.fill();
        }

        /**
         * Draws the clock hands.
         * @param {number} pos - The position value (ke, minute, or second).
         * @param {string} type - The type of hand ('geng', 'minute', 'second', 'sunsetMarker', 'sunriseMarker', 'geng').
         */
        function drawHand(pos, type, longitudeOffset = 0) {
            let length;
            let width;
            let angle;
            let totalUnits; // Total units for a full circle for this hand type
            let color;

            ctx.beginPath();
            switch (type) {
                case "geng": // New Geng Hand
                    length = radius * 0.4; // Updated length ratio to 0.4
                    width = radius * 0.03 * 2; // Same width as minute hand
                    totalUnits = 10; // 10 NuTime gengs in a full circle
                    angle = Math.PI + (pos / totalUnits) * 2 * Math.PI + longitudeOffset; // Apply longitudeOffset
                    color = '#4169E1'; // Vibrant Blue
                    break;
                case "ke":
                    length = radius * 0.8; // Changed to 0.8 * radius
                    width = radius * 0.04; // This width is for the line if it were drawn
                    totalUnits = 100; // 100 kes in a full circle
                    // Angle for clockwise rotation from 6 o'clock (bottom), offset by longitude
                    angle = Math.PI + (pos / totalUnits) * 2 * Math.PI + longitudeOffset; // Already applied
                    color = isNightMode ? '#E2E2E2' : '#FFB347'; // Changed to E2E2E2 for night mode

                    const circleRadius = radius * 0.04 * 2; // Reverted ke marker circle size

                    // Only draw the circle for the ke hand, making the arm transparent
                    ctx.beginPath();
                    ctx.rotate(angle);
                    ctx.arc(0, -length, circleRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = color; // Use the conditional color
                    ctx.fill();
                    ctx.rotate(-angle); // Rotate back for next hand
                    return; // Exit function after drawing ke hand
                case "minute":
                    length = radius * 0.60; // Changed to 0.60 * radius
                    width = radius * 0.03 * 2;
                    totalUnits = 100; // 100 minutes per geng (full circle for minute hand)
                    // Angle for clockwise rotation from 6 o'clock (bottom)
                    // Initial angle is Math.PI (6 o'clock). Add for clockwise rotation.
                    angle = Math.PI + (pos / totalUnits) * 2 * Math.PI + longitudeOffset; // Apply longitudeOffset
                    color = '#FF4500'; // Vibrant Red
                    break;
                case "second":
                    length = radius * 0.60; // Set to outermost concentric circle radius
                    width = radius * 0.01;
                    totalUnits = 100; // 100 seconds per minute (full circle for second hand)
                    // Angle for clockwise rotation from 6 o'clock (bottom)
                    // Initial angle is Math.PI (6 o'clock). Add for clockwise rotation.
                    angle = Math.PI + (pos / totalUnits) * 2 * Math.PI + longitudeOffset; // Apply longitudeOffset
                    color = '#d5a763'; // Changed to #d5a763
                    break;
                case "sunsetMarker": // Case for the sunset marker, now a white triangle
                    // The base of the triangle should be at the outermost dark grey perimeter (radius)
                    length = radius; // The base of the triangle will be at this distance from center
                    width = radius * 0.08; // Size of the triangle (height from base to tip)
                    totalUnits = 100000; // Total NuTime seconds in a day for positioning
                    // Angle for clockwise rotation from 6 o'clock (bottom), offset by longitude
                    angle = Math.PI + (pos / totalUnits) * 2 * Math.PI + longitudeOffset; // Used passed longitudeOffset
                    color = '#E2E2E2'; // Changed to E2E2E2

                    ctx.rotate(angle);
                    // Draw triangle: tip is further out, base is at 'length'
                    ctx.moveTo(0, -length + width); // Apex (pointing inward)
                    ctx.lineTo(-width / 2, -length); // Bottom-left point (base at perimeter)
                    ctx.lineTo(width / 2, -length); // Bottom-right point (base at perimeter)
                    ctx.closePath();
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.rotate(-angle); // Rotate back
                    return; // Exit function after drawing marker
                case "sunriseMarker": // Case for the sunrise marker, now a yellow triangle
                    // The base of the triangle should be at the outermost dark grey perimeter (radius)
                    length = radius; // The base of the triangle will be at this distance from center
                    width = radius * 0.08; // Size of the triangle (height from base to tip)
                    totalUnits = 100000; // Total NuTime seconds in a day for positioning
                    // Angle for clockwise rotation from 6 o'clock (bottom), offset by longitude
                    angle = Math.PI + (pos / totalUnits) * 2 * Math.PI + longitudeOffset; // Used passed longitudeOffset
                    color = '#FFB347'; // Changed to Lighter Orange #FFB347

                    ctx.beginPath();
                    ctx.rotate(angle);
                    ctx.moveTo(0, -length + width); // Apex (pointing inward)
                    ctx.lineTo(-width / 2, -length); // Bottom-left point (base at perimeter)
                    ctx.lineTo(width / 2, -length); // Bottom-right point (base at perimeter)
                    ctx.closePath();
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.rotate(-angle); // Rotate back
                    return; // Exit function after drawing marker
            }

            ctx.lineWidth = width;
            ctx.lineCap = "round";
            ctx.strokeStyle = color;
            ctx.moveTo(0, 0);
            ctx.rotate(angle);
            ctx.lineTo(0, -length); // Draw upwards in the rotated coordinate system
            ctx.stroke();
            ctx.rotate(-angle); // Rotate back for next hand
        }

        /**
         * Handles the change event for the location select dropdown.
         * Updates userLatitude and userLongitude based on the selected option.
         * If "Current Location" is selected, it1 attempts to get geolocation.
         * @param {Event} event - The change event object.
         */
        function handleLocationChange(event) {
            const selectedOption = event.target.options[event.target.selectedIndex];
            const value = selectedOption.value;

            // Clear any existing automatic location updates
            if (locationIntervalId) {
                clearInterval(locationIntervalId);
            }
            isLocationManuallySet = true; // A selection has been made

            if (value === "current") {
                isLocationManuallySet = false; // Allow auto-detect to run again
                getUserLocation(); // Attempt to get current location
                // Re-establish the interval if "Current Location" is selected
                locationIntervalId = setInterval(getUserLocation, 5000);
            } else {
                userLatitude = parseFloat(selectedOption.dataset.lat);
                userLongitude = parseFloat(selectedOption.dataset.lon);
                updateGreenwichTimes(); // Recalculate sunrise/sunset with new location
                updateBackgroundSkyColor(); // Update background to new sky color
                updateKeTime(); // Redraw clock with new location offset
            }
        }

        /**
         * Fetches and displays the user's current longitude and latitude.
         */
        function getUserLocation() {
            // Only proceed if a location hasn't been manually set
            if (isLocationManuallySet) {
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLongitude = position.coords.longitude;
                        userLatitude = position.coords.latitude;
                        updateGreenwichTimes(); // Recalculate sunrise/sunset with user's location
                        updateBackgroundSkyColor(); // Update background to current sky color
                        updateKeTime(); // Redraw clock with new location offset
                        isLocationManuallySet = true; // Mark as set after successful auto-detection
                        if (locationIntervalId) {
                            clearInterval(locationIntervalId); // Stop further automatic updates
                        }
                    },
                    (error) => {
                        console.error('Error getting location:', error);
                        // Fallback to Greenwich, UK coordinates on error
                        userLongitude = DEFAULT_LONGITUDE;
                        userLatitude = DEFAULT_LATITUDE;
                        updateGreenwichTimes(); // Recalculate sunrise/sunset with default location
                        updateBackgroundSkyColor(); // Update background to current sky color
                        updateKeTime(); // Redraw clock with new location offset
                        isLocationManuallySet = true; // Mark as set even on error, to prevent constant retries
                        if (locationIntervalId) {
                            clearInterval(locationIntervalId); // Stop further automatic updates
                        }
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                // Fallback to Greenwich, UK coordinates if geolocation not supported
                userLongitude = DEFAULT_LONGITUDE;
                userLatitude = DEFAULT_LATITUDE;
                updateGreenwichTimes(); // Recalculate sunrise/sunset with default location
                updateBackgroundSkyColor(); // Update background to current sky color
                updateKeTime(); // Redraw clock with new location offset
                isLocationManuallySet = true; // Mark as set
                if (locationIntervalId) {
                    clearInterval(locationIntervalId); // Stop further automatic updates
                }
            }
        }

        /**
         * Populates the location dropdown with predefined cities.
         */
        function populateLocationDropdown() {
            const locationSelect = document.getElementById('locationSelect');
            // Clear existing options except the first two (Choose and Current)
            while (locationSelect.options.length > 2) {
                locationSelect.remove(2);
            }

            predefinedLocations.forEach(location => {
                const option = document.createElement('option');
                option.value = location.city.toLowerCase().replace(/\s/g, '_'); // Create a unique value
                option.dataset.lat = location.latitude;
                option.dataset.lon = location.longitude;
                option.textContent = `${location.city}, ${location.country}`;
                locationSelect.appendChild(option);
            });
        }


        /**
         * Calculates and displays the current time in the custom NuTime system based on GMT,
         * and updates the analog clock. Also displays standard GMT and Unix time.
         *
         * This function is called repeatedly to update the clock in real-time.
         */
        function updateKeTime() {
            const now = new Date();
            // Use UTC methods to get GMT time components
            const standardGengs = now.getUTCHours();
            const standardMinutes = now.getUTCMinutes();
            const standardSeconds = now.getUTCSeconds();
            const standardMilliseconds = now.getUTCMilliseconds();

            // Calculate total standard seconds from midnight GMT (24 gengs * 60 minutes/geng * 60 seconds/minute)
            const totalStandardSeconds = (standardGengs * 3600) + (standardMinutes * 60) + standardSeconds + (standardMilliseconds / 1000);

            // Calculate the fraction of the standard day that has passed
            const fractionOfDay = totalStandardSeconds / 86400; // Total seconds in a standard day

            // Calculate the total NuTime-Seconds from midnight in the new system (100,000 NuTime-Seconds per day)
            const totalNuTimeSeconds = fractionOfDay * 100000;

            // Decompose totalNuTimeSeconds into NuTime components (Geng:Minute:Second)
            const nuGengs_float = totalNuTimeSeconds / 10000; // 1 NuGeng = 10,000 NuTime seconds
            const remainingSecondsAfterNuGengs_float = totalNuTimeSeconds % 10000;

            const nuMinutes_float = remainingSecondsAfterNuGengs_float / 100; // 1 NuMinute = 100 NuTime seconds
            const nuSeconds_float = remainingSecondsAfterNuGengs_float % 100; // Remaining seconds after NuMinutes (keep as float for smooth movement)

            // Update the digital NuTime display
            document.getElementById('gongTimeDisplay').textContent =
                `${pad(Math.floor(nuGengs_float))}:${pad(Math.floor(nuMinutes_float))}:${pad(Math.floor(nuSeconds_float))}`; // Floor only for digital display

            // Update Standard GMT Time display (unchanged)
            document.getElementById('gmtTimeDisplay').textContent =
                `${pad(standardGengs)}:${pad(standardMinutes)}:${pad(standardSeconds)}`;

            // Calculate visual angles for night mode logic
            const NuTime_to_Radians_Factor = (2 * Math.PI) / 100000;
            const Longitude_to_Radians_Factor = (2 * Math.PI) / 360;
            const Initial_Offset_Radians = Math.PI; // For 6 o'clock start

            // Round userLongitude to the nearest 3.6 degrees before calculating the offset
            const roundedLongitude = Math.round(userLongitude / 3.6) * 3.6;
            const longitudeOffsetRadians = (roundedLongitude / 360) * 2 * Math.PI;

            const currentKeVisualAngle = normalizeAngle(Initial_Offset_Radians + (totalNuTimeSeconds * NuTime_to_Radians_Factor) + longitudeOffsetRadians);
            const sunriseVisualAngle = normalizeAngle(Initial_Offset_Radians + (sunriseNuTimeSeconds * NuTime_to_Radians_Factor) + longitudeOffsetRadians);
            const sunsetVisualAngle = normalizeAngle(Initial_Offset_Radians + (sunsetNuTimeSeconds * NuTime_to_Radians_Factor) + longitudeOffsetRadians);

            // Determine if it's night mode based on visual angles
            if (sunsetVisualAngle < sunriseVisualAngle) {
                isNightMode = (currentKeVisualAngle >= sunsetVisualAngle && currentKeVisualAngle < sunriseVisualAngle);
            } else {
                isNightMode = (currentKeVisualAngle >= sunsetVisualAngle || currentKeVisualAngle < sunriseVisualAngle);
            }

            // Update background sky color continuously
            updateBackgroundSkyColor();

            // Update the analog clock
            ctx.clearRect(-radius, -radius, canvas.width, canvas.height); // Clear canvas
            drawFace(longitudeOffsetRadians); // Pass longitudeOffsetRadians to drawFace

            // Draw sunset and sunrise markers
            if (sunsetNuTimeSeconds !== 0) {
                drawHand(sunsetNuTimeSeconds, "sunsetMarker", longitudeOffsetRadians); // Pass longitudeOffsetRadians
            }
            if (sunriseNuTimeSeconds !== 0) {
                drawHand(sunriseNuTimeSeconds, "sunriseMarker", longitudeOffsetRadians); // Pass longitudeOffsetRadians
            }

            // Draw new geng hand, ke hand, minute hand, second hand
            drawHand(nuGengs_float, "geng", longitudeOffsetRadians); // New Geng hand (0-10)
            drawHand(totalNuTimeSeconds / 1000, "ke", longitudeOffsetRadians); // Ke hand (0-100)
            drawHand(nuMinutes_float, "minute", longitudeOffsetRadians); // Minute hand (0-100)
            drawHand(nuSeconds_float, "second", longitudeOffsetRadians); // Second hand (0-100)

            requestAnimationFrame(updateKeTime); // Use requestAnimationFrame for smooth updates
        }

        /**
         * Calculates and displays Greenwich sunrise and sunset times in GMT and NuTime.
         * This function should be called once per day or when the date changes.
         * This will now use the user's location (or default)
         */
        function updateGreenwichTimes() {
            const today = new Date();
            // SunCalc.getTimes returns times in local timezone Date objects.
            // We now use userLatitude and userLongitude
            const times = SunCalc.getTimes(today, userLatitude, userLongitude);

            // Convert sunrise and sunset to NuTime
            const sunriseNuTimeString = convertGMTToNuTime(times.sunrise);
            const sunsetNuTimeString = convertGMTToNuTime(times.sunset);

            // Store the NuTime seconds for comparison (still needed for night mode logic)
            sunriseNuTimeSeconds = nuTimeStringToSeconds(sunriseNuTimeString);
            sunsetNuTimeSeconds = nuTimeStringToSeconds(sunsetNuTimeString);
        }


        // Initialize the current NuTime display and set an interval to update it every standard second
        window.onload = function() {
            // Adjust canvas size for responsiveness
            const setCanvasSize = () => {
                const containerWidth = canvas.parentElement.clientWidth;
                const displaySize = Math.min(containerWidth * 0.8, 300); // Max 300px display size

                const dpr = window.devicePixelRatio || 1; // Get device pixel ratio

                // Set canvas's internal drawing buffer size to a higher resolution
                canvas.width = displaySize * dpr;
                canvas.height = displaySize * dpr;

                // Set canvas's CSS (displayed) size
                canvas.style.width = `${displaySize}px`;
                canvas.style.height = `${displaySize}px`;

                // Reset the canvas transformation matrix
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                // Scale the context to match the device pixel ratio
                ctx.scale(dpr, dpr);

                // Translate the context origin to the center of the *displayed* canvas
                // The drawing commands will then use this scaled context.
                ctx.translate(displaySize / 2, displaySize / 2);

                // Recalculate radius based on the *display* size
                radius = (displaySize / 2) * 0.90; // Adjust radius to leave some margin

                // Initial draw after size is set
                updateKeTime(); 
            };

            setCanvasSize(); // Set initial size
            window.addEventListener('resize', setCanvasSize); // Adjust on resize

            // Populate the dropdown with the new list of locations
            populateLocationDropdown();

            // Get user's location initially
            getUserLocation();
            // Store the interval ID for potential clearing later
            locationIntervalId = setInterval(getUserLocation, 5000); // Keep for periodic location updates

            // Update Greenwich times initially and then once every geng to catch date changes
            updateGreenwichTimes();
            updateBackgroundSkyColor();
            setInterval(updateGreenwichTimes, 3600 * 1000); // Update every geng

            // Start the animation loop using requestAnimationFrame
            requestAnimationFrame(updateKeTime);

            // Add event listener for location selection
            document.getElementById('locationSelect').addEventListener('change', handleLocationChange);
        };
    </script>
